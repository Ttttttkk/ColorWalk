<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收集世界的颜色</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="hero-panel" aria-labelledby="site-title">
      <p class="eyebrow">Photo Palette</p>
      <h1 id="site-title">收集世界的颜色</h1>
      <p class="intro">上传一张照片，把那一刻的光、影和心情收成一张柔软的色卡。</p>

      <div class="upload-card" id="drop-zone">
        <input id="file-input" type="file" accept="image/png,image/jpeg" hidden>
        <button class="primary-button" id="upload-button" type="button">选择照片</button>
        <p id="upload-hint">也可以把 JPG 或 PNG 拖到这里</p>
      </div>
    </section>

    <section class="gallery-state" id="gallery-state" hidden>
      <div class="photo-wrap">
        <img id="photo-preview" alt="上传的照片预览">
      </div>
      <div class="palette-strip" id="palette-strip" aria-label="生成的色卡"></div>
      <div class="action-row">
        <button class="ghost-button" id="change-photo-button" type="button">换一张</button>
        <button class="primary-button" id="edit-output-button" type="button">编辑成果图</button>
      </div>
    </section>

    <section class="editor-state" id="editor-state" hidden>
      <div class="export-stage">
        <div id="export-preview" class="export-preview"></div>
      </div>
      <aside class="settings-panel" aria-label="输出设置">
        <h2>输出设置</h2>
        <div id="settings-controls"></div>
        <button class="primary-button full" id="download-button" type="button">下载 PNG</button>
      </aside>
    </section>

    <p class="message" id="message" role="status"></p>
  </main>
</body>
</html>
